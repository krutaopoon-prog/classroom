        <div id="chapter-grid" class="chapter-list mt-lg">

  <script src="../../assets/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Show quiz score if completed
      const score = getQuizScore('electronics1', 1);
      if (score) {
        const statusEl = document.getElementById('status-electronics1-ch1');
        if (statusEl) {
          statusEl.innerHTML = `คะแนนแบบทดสอบ: <strong>${formatScore(score.score, score.total)}</strong>`;
          statusEl.classList.add('tag', 'tag--success');
        }
      }
    });
