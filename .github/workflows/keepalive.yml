# กันโปรเจกต์ Supabase แพ็กเกจฟรีหยุดชั่วคราว (หยุดเมื่อไม่มีการใช้งาน 7 วัน)
# เรียกฟังก์ชัน ping ทุก 3 วัน ด้วยค่าใน config.js (anon key เปิดเผยได้)
name: keepalive
on:
  schedule:
    - cron: '17 2 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP "url:\s*'\K[^']+" config.js)
          KEY=$(grep -oP "anonKey:\s*'\K[^']+" config.js)
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
